name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: svvr-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after installing a dedicated key for the replacement VPS.
    if: vars.SVVR_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 31.57.105.22
      SSH_USER: svvr-deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SVVR_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SVVR_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Back up and deploy source without production data
        run: |
          set -eu
          rsync -az --no-owner --no-group -e 'ssh -o StrictHostKeyChecking=yes' \
            --include='/main.py' --include='/requirements.txt' \
            --include='/bot/' --include='/DB/' --include='/deploy/' \
            --include='*.py' --include='*.service' --include='*.timer' \
            --include='*.sh' --include='*.md' --exclude='*' \
            ./ "$SSH_USER@$SSH_HOST":/var/lib/svvr-deploy/incoming/
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'sudo -n /usr/local/sbin/svvr-install'
          sleep 15
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'systemctl is-active --quiet svvr-osushenie-bot.service'
